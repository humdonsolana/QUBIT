<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBFE66"/>
      <stop offset="0.5" stop-color="#F8267E"/>
      <stop offset="1" stop-color="#BE42F8"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#F8267E"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#0B0B0F"/>
  <text x="600" y="48" text-anchor="middle" fill="#F5F5F7" font-size="22" font-weight="700">How the mint address was born</text>
  <!-- step cards -->
  <g font-size="15" text-anchor="middle">
    <rect x="30" y="86" width="196" height="150" rx="16" fill="#16161C"/>
    <text x="128" y="118" fill="#8A8A99" font-size="12" font-weight="700" letter-spacing="2">IBM QUANTUM</text>
    <text x="128" y="156" fill="#FFFFFF" font-size="19" font-weight="700">16 qubits × 16 shots</text>
    <text x="128" y="186" fill="#B9B9C6">Hadamard on each,</text>
    <text x="128" y="208" fill="#B9B9C6">run on ibm_marrakesh</text>

    <rect x="262" y="86" width="196" height="150" rx="16" fill="#16161C"/>
    <text x="360" y="118" fill="#8A8A99" font-size="12" font-weight="700" letter-spacing="2">ENTROPY</text>
    <text x="360" y="156" fill="#FFFFFF" font-size="19" font-weight="700">256 bits</text>
    <text x="360" y="186" fill="#B9B9C6">the 16 bitstrings,</text>
    <text x="360" y="208" fill="#B9B9C6">in shot order</text>

    <rect x="494" y="86" width="212" height="150" rx="16" fill="#16161C"/>
    <text x="600" y="118" fill="#8A8A99" font-size="12" font-weight="700" letter-spacing="2">PUBLIC SEARCH</text>
    <text x="600" y="156" fill="#FFFFFF" font-size="18" font-weight="700">SHA-256(bits ‖ n)</text>
    <text x="600" y="186" fill="#B9B9C6">first n whose address</text>
    <text x="600" y="208" fill="#B9B9C6">ends in “qubit”: 78,704,486</text>

    <rect x="742" y="86" width="196" height="150" rx="16" fill="#16161C"/>
    <text x="840" y="118" fill="#8A8A99" font-size="12" font-weight="700" letter-spacing="2">RFC 8032</text>
    <text x="840" y="156" fill="#FFFFFF" font-size="19" font-weight="700">ed25519 keypair</text>
    <text x="840" y="186" fill="#B9B9C6">same derivation as</text>
    <text x="840" y="208" fill="#B9B9C6">Keypair::from_seed</text>

    <rect x="974" y="86" width="196" height="150" rx="16" fill="#16161C" stroke="url(#brand)" stroke-width="2"/>
    <text x="1072" y="118" fill="#8A8A99" font-size="12" font-weight="700" letter-spacing="2">MINT ADDRESS</text>
    <text x="1072" y="156" fill="#FFFFFF" font-size="19" font-weight="700">ERkm…QuBit</text>
    <text x="1072" y="186" fill="#B9B9C6">the public key,</text>
    <text x="1072" y="208" fill="#B9B9C6">checked with verify.py</text>
  </g>
  <!-- arrows -->
  <g stroke="url(#brand)" stroke-width="3" fill="none" marker-end="url(#tip)">
    <path d="M230 161H256"/>
    <path d="M462 161H488"/>
    <path d="M710 161H736"/>
    <path d="M942 161H968"/>
  </g>
  <text x="600" y="272" text-anchor="middle" fill="#8A8A99" font-size="14">Rule committed and archived before the job ran. The launch memo locks the SHA-256 of the results.</text>
</svg>
