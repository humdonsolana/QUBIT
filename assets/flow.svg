<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBFE66"/>
      <stop offset="0.5" stop-color="#F8267E"/>
      <stop offset="1" stop-color="#BE42F8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A8A99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="330" rx="24" fill="#121217"/>
  <text x="600" y="48" text-anchor="middle" fill="#F5F5F7" font-size="24" font-weight="700">How a spend works</text>
  <!-- five steps -->
  <g fill="#1F1F27">
    <rect x="30" y="90" width="200" height="110" rx="16"/>
    <rect x="270" y="90" width="200" height="110" rx="16"/>
    <rect x="510" y="90" width="200" height="110" rx="16"/>
    <rect x="750" y="90" width="200" height="110" rx="16"/>
    <rect x="990" y="90" width="180" height="110" rx="16"/>
  </g>
  <g fill="url(#brand)" font-size="13" font-weight="700">
    <text x="48" y="114">STEP 1</text>
    <text x="288" y="114">STEP 2</text>
    <text x="528" y="114">STEP 3</text>
    <text x="768" y="114">STEP 4</text>
    <text x="1008" y="114">STEP 5</text>
  </g>
  <g fill="#FFFFFF" font-size="18" font-weight="600">
    <text x="48" y="146">Your 24 words</text>
    <text x="288" y="146">One-time key #i</text>
    <text x="528" y="146">2 KB signature</text>
    <text x="768" y="146">Vault verifies</text>
    <text x="1008" y="146">Funds move</text>
  </g>
  <g fill="#B9B9C6" font-size="15">
    <text x="48" y="172">derive key number i</text>
    <text x="288" y="172">never used before</text>
    <text x="528" y="172">of this transfer</text>
    <text x="768" y="172">SHA-256 only</text>
    <text x="1008" y="172">treasury signs it</text>
  </g>
  <g stroke="#8A8A99" stroke-width="2" marker-end="url(#arrow)">
    <line x1="232" y1="145" x2="266" y2="145"/>
    <line x1="472" y1="145" x2="506" y2="145"/>
    <line x1="712" y1="145" x2="746" y2="145"/>
    <line x1="952" y1="145" x2="986" y2="145"/>
  </g>
  <!-- rotation note -->
  <rect x="30" y="228" width="1140" height="66" rx="14" fill="none" stroke="url(#brand)" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" fill="#F5F5F7" font-size="17" font-weight="600">Then the lock becomes the hash of key #i+1. Key #i is never used again.</text>
  <text x="600" y="280" text-anchor="middle" fill="#8A8A99" font-size="15">Before signing, the client writes down what it is about to sign, so a crash or retry can never produce two signatures from one key.</text>
</svg>
