name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude qubit-vault
      - run: python3 -I tests/reference/wots_ref.py --check crates/wots/tests/vectors.json
  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.1/install)"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: scripts/build-program.sh
      - run: cargo test -p qubit-vault
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 src/verify.py proof/quantum_results.json ERkmk5rs8KKD9u2fxoDZUmwwuVc7rT3sSeowGTrQuBit 78704486
