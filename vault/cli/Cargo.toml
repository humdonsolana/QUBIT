[package]
name = "qubit"
description = "Command-line client for the QUBIT vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "qubit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
bip39 = { version = "3.0.0", features = ["rand"] }
qubit-interface.workspace = true
qubit-wots = { workspace = true, features = ["host"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
serde.workspace = true
serde_json.workspace = true
solana-address = { version = "2.9.0", features = ["std", "curve25519", "copy"] }
solana-hash = { version = "4.7.0", features = ["std", "decode", "copy"] }
solana-instruction = "4.0.0"
solana-keypair = "4.0.0"
solana-message = { version = "5.1.0", features = ["wincode"] }
solana-signer = "4.0.0"
solana-transaction = { version = "5.1.0", features = ["wincode"] }
ureq = { version = "3.4.2", features = ["json"] }
wincode = { version = "0.6.2", features = ["alloc"] }
zeroize = "1.9.1"
