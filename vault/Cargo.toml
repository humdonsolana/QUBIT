[workspace]
resolver = "2"
members = ["crates/wots", "crates/interface", "programs/vault", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/humdonsolana/QUBIT"

[workspace.dependencies]
qubit-wots = { path = "crates/wots" }
qubit-interface = { path = "crates/interface" }
anyhow = "1.0.104"
proptest = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[profile.release]
overflow-checks = true
